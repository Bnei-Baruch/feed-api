name: Pull Request CI

on:
  pull_request:
    branches:
      - 'master'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres: # Tests build temporary databases from the migrations here.
        image: postgres:13
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.17

      - name: Run unit tests
        env:
          GOOS: linux
          CGO_ENABLED: 0
          FEED_TEST_PG_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: |
          mv config.sample.toml config.toml
          set -o pipefail
          go test -v ./... | tee test.log
        continue-on-error: false

      - name: Upload test log if tests fail
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test.log

  